<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Valhein</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      text-align: center; /* จัดทุกอย่างให้อยู่กึ่งกลางหน้าจอ */
    }

    /* หัวข้อชื่อตัวละครด้านบนสุด */
    h1 {
      color: red;
      font-size: 48px;
      margin-bottom: 20px;
    }

    /* ตกแต่งปุ่มเมนูทั้ง 5 ปุ่ม */
    button {
      background-color: #0099ff; /* สีพื้นหลังปุ่ม */
      color: #00ff00;            /* สีตัวหนังสือบนปุ่ม */
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 15px;       /* ทำขอบปุ่มให้โค้งมน */
      padding: 12px 24px;
      margin: 5px;
      cursor: pointer;
    }

    /* ปรับขนาดรูปภาพตัวละคร */
    img {
      width: 350px;              /* กำหนดแค่ความกว้าง ความสูงจะปรับตามสัดส่วนอัตโนมัติ */
      margin-top: 25px;
    }

    /* ชื่อรองใต้รูปภาพ */
    h2 {
      color: red;
      font-size: 28px;
      margin-bottom: 10px;
    }

    /* คำคมตัวละคร */
    .quote {
      color: #4b0082;
      font-weight: bold;
      font-size: 16px;
    }

    /* คำอธิบายสายฮีโร่ */
    .desc {
      color: red;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>valhein</h1>

  <!-- ปุ่มเมนู 5 ปุ่ม (เตรียมไว้ใส่ลิงก์ในสัปดาห์หน้า) -->
  <div>
    <button>ประวัติ</button>
    <button>สกิล</button>
    <button>ไอเทมแนะนำ</button>
    <button>รูน</button>
    <button>พลังแฝง</button>
  </div>

  <!-- รูปตัวละคร -->
  <img src="https://www.rov.in.th/hero/valhein" alt="รูปตัวละคร Valhein">

  <h2>Valhein<br>(Van Helsing)</h2>

  <p class="quote">ข้าเคยเป็นความหวังเพียงหนึ่งเดียวของมนุษยชาติในสงครามแวมไพร์ที่ยาวนานร่วมศตวรรษ</p>
  
  <p class="desc">เป็นฮีโร่สายยิงระยะไกลตัวเริ่มต้นของเกม RoV ที่ทำหน้าที่เป็น<br>ผู้บัญชาการนักล่าปีศาจรุ่นที่ 2</p>

</body>
</html>
