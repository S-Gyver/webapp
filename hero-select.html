<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เลือกตัวละคร RoV ประจำตัว</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    :root {
      --ios-bg: #000000;
      --ios-card: #1C1C1E;
      --ios-fill: rgba(118, 118, 128, 0.24);
      --ios-separator: rgba(255, 255, 255, 0.12);
      --ios-label: #FFFFFF;
      --ios-secondary: #AEAEB2;
      --ios-blue: #0A84FF;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .mobile-header {
      text-align: center;
      margin-bottom: 16px;
      padding: 12px 0;
    }
    .mobile-title {
      font-size: 22px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .mobile-sub {
      font-size: 13px;
      color: #AEAEB2;
    }
    .room-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(10, 132, 255, 0.18);
      color: #64D2FF;
      font-size: 12px;
      font-weight: 800;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="mobile-header">
    <div class="mobile-title">🎮 เลือกตัวละคร RoV ของคุณ</div>
    <div class="mobile-sub">แตะเลือก 1 ตัวละครประจำตัว (จะโชว์ขึ้นจอโปรเจกเตอร์ทันที!)</div>
    <div class="room-badge" id="roomDisplayBadge">📡 เชื่อมต่อห้องฉายโปรเจกเตอร์แล้ว</div>
  </div>

  <div class="hero-board-card" style="border:none; padding:0; background:transparent;">
    <!-- แถบตัวกรองและค้นหา -->
    <div class="hero-filter-bar">
      <div class="hero-filter-tabs">
        <button type="button" class="hero-tab-btn active" onclick="filterHeroRole('all', this)">ทั้งหมด</button>
        <button type="button" class="hero-tab-btn" onclick="filterHeroRole('แครี่', this)">🏹 แครี่</button>
        <button type="button" class="hero-tab-btn" onclick="filterHeroRole('แอสซาซิน', this)">🗡️ แอสซาซิน</button>
        <button type="button" class="hero-tab-btn" onclick="filterHeroRole('เมจ', this)">⚡ เมจ</button>
        <button type="button" class="hero-tab-btn" onclick="filterHeroRole('ไฟต์เตอร์', this)">⚔️ ไฟต์เตอร์</button>
        <button type="button" class="hero-tab-btn" onclick="filterHeroRole('แทงค์', this)">🛡️ แทงค์</button>
        <button type="button" class="hero-tab-btn" onclick="filterHeroRole('ซัพพอร์ต', this)">🌿 ซัพพอร์ต</button>
      </div>
      <div class="hero-search-wrap" style="width:100%; margin-top:8px;">
        <input type="text" id="heroSearchInput" class="hero-search-input" placeholder="🔍 ค้นหาชื่อฮีโร่ เช่น Valhein, Violet..." oninput="onHeroSearch(this.value)">
      </div>
    </div>

    <!-- ตารางการ์ดตัวละคร -->
    <div class="hero-cards-grid" id="heroCardsGrid" style="max-height: calc(100vh - 220px);"></div>
  </div>

    const urlParams = new URLSearchParams(window.location.search);
    const DEFAULT_LIVE_ROOM = 'rov_webapp_sgyver_2026';
    const roomId = urlParams.get('room') || DEFAULT_LIVE_ROOM;
    let currentHeroRoleFilter = 'all';
    let currentHeroSearchQuery = '';
    let localClaims = {};

    function getHeroClaims() {
      try {
        const d = localStorage.getItem('wc_rov_hero_claims');
        return d ? JSON.parse(d) : localClaims;
      } catch(e) { return localClaims; }
    }
    function saveHeroClaims(c) {
      localClaims = c;
      try { localStorage.setItem('wc_rov_hero_claims', JSON.stringify(c)); } catch(e) {}
    }

    function renderHeroGrid() {
      const grid = document.getElementById('heroCardsGrid');
      if (!grid) return;
      const claims = getHeroClaims();
      const q = currentHeroSearchQuery.toLowerCase().trim();

      const filtered = ROV_HERO_LIST.filter(hero => {
        const matchRole = currentHeroRoleFilter === 'all' || hero.role === currentHeroRoleFilter;
        const matchSearch = !q || hero.name.toLowerCase().includes(q) || hero.id.toLowerCase().includes(q);
        return matchRole && matchSearch;
      });

      grid.innerHTML = filtered.map(hero => {
        const owner = claims[hero.id];
        const isClaimed = Boolean(owner);
        return `
          <div class="hero-card-item ${isClaimed ? 'claimed' : 'available'}" onclick="clickHeroCard('${hero.id}')">
            <div class="hero-avatar-wrap">
              <img src="${hero.image}" alt="${hero.name}" class="hero-avatar-img" loading="lazy" onerror="this.src='images/valhein.png'">
              <span class="hero-role-badge role-${hero.roleEn}">${hero.icon} ${hero.role}</span>
              ${isClaimed ? '<span class="hero-lock-badge">🔒 จองแล้ว</span>' : ''}
            </div>
            <div class="hero-card-info">
              <div class="hero-name-label">${hero.name}</div>
              <div class="hero-owner-label">
                ${isClaimed ? '👤 <b>' + escapeHtml(owner) + '</b>' : '<span class="tap-to-pick">แตะเลือกตัวนี้ ✨</span>'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function filterHeroRole(role, btn) {
      currentHeroRoleFilter = role;
      document.querySelectorAll('.hero-tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderHeroGrid();
    }

    function onHeroSearch(val) {
      currentHeroSearchQuery = val || '';
      renderHeroGrid();
    }

    function closeCustomModal() {
      const el = document.getElementById('__iosCustomModal');
      if (el) el.remove();
    }

    function clickHeroCard(heroId) {
      const hero = ROV_HERO_LIST.find(h => h.id === heroId);
      if (!hero) return;
      const claims = getHeroClaims();

      if (claims[heroId]) {
        alert('ตัวละคร ' + hero.name + ' ถูกจองโดย ' + claims[heroId] + ' แล้วครับ ลองเลือกตัวอื่นดูนะ!');
        return;
      }

      closeCustomModal();
      const overlay = document.createElement('div');
      overlay.id = '__iosCustomModal';
      overlay.className = 'ios-custom-overlay';
      overlay.innerHTML = `
        <div class="ios-custom-card">
          <img src="${hero.image}" alt="${hero.name}" class="ios-modal-hero-img" onerror="this.src='images/valhein.png'">
          <span class="ios-modal-role-pill">${hero.icon} ${hero.role}</span>
          <div class="ios-modal-title">${hero.name}</div>
          <div class="ios-modal-sub">พิมพ์ชื่อหรือชื่อเล่นของคุณ (เพื่อส่งขึ้นจอโปรเจกเตอร์):</div>
          
          <input type="text" id="__heroInputName" class="ios-modal-input" placeholder="เช่น น้องกานต์ ม.1/2" maxlength="30" autocomplete="off">
          
          <div class="ios-modal-btn-row">
            <button type="button" class="ios-modal-btn btn-cancel" onclick="closeCustomModal()">ยกเลิก</button>
            <button type="button" id="__heroSubmitBtn" class="ios-modal-btn btn-confirm">✨ ยืนยันการจอง</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const input = document.getElementById('__heroInputName');
      const submitBtn = document.getElementById('__heroSubmitBtn');
      setTimeout(() => input.focus(), 60);

      function doSubmit() {
        const studentName = input.value.trim();
        if (!studentName) {
          input.focus();
          return;
        }
        closeCustomModal();
        claims[heroId] = studentName;
        saveHeroClaims(claims);
        renderHeroGrid();

        const pickPayload = JSON.stringify({
          heroId: heroId,
          studentName: studentName,
          time: Date.now(),
          id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5)
        });

        // 1. Broadcast ผ่าน window.BroadcastChannel (ถ้าเปิดบนคอมเดียวกัน)
        try {
          if (window.BroadcastChannel) {
            const bc = new BroadcastChannel('rov_webapp_live_sync');
            bc.postMessage(JSON.parse(pickPayload));
          }
        } catch(e) {}

        // 2. Broadcast ผ่าน localStorage trigger
        try {
          localStorage.setItem('wc_rov_last_claim_trigger', pickPayload);
        } catch(e) {}

        // 3. ส่งสัญญาณ Realtime ไปยัง ntfy.sh (แบบ text/plain ไร้ปัญหา CORS เข้าจอโปรเจกเตอร์ครูทันที!)
        try {
          fetch('https://ntfy.sh/' + roomId, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: pickPayload
          }).then(r => console.log('Sync sent to projector:', r.status))
            .catch(err => console.error('Sync error:', err));
        } catch(e) {}

        alert('🎉 ล็อกตัวละคร ' + hero.name + ' สำเร็จแล้ว! ดูที่จอโปรเจกเตอร์ได้เลยครับ!');
      }

      submitBtn.onclick = doSubmit;
      input.onkeydown = (e) => { if (e.key === 'Enter') doSubmit(); };
      overlay.onclick = (e) => { if (e.target === overlay) closeCustomModal(); };
    }

    renderHeroGrid();
  </script>
